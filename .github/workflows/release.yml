name: Build and release firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # OpenBMC needs more disk space than the default runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Prepare build volume
        run: |
          mkdir -p "$RUNNER_TEMP/openbmc-work/build/sstate-cache"
          docker volume create --driver local \
            --opt type=none --opt o=bind \
            --opt "device=$RUNNER_TEMP/openbmc-work" openbmc-x570d4u

      - name: Restore BitBake shared state
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/openbmc-work/build/sstate-cache
          key: sstate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openbmc-revision', 'Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sstate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openbmc-revision', 'Dockerfile') }}-

      - name: Build firmware
        id: build
        env:
          BUILD_THREADS: 4
          MAKE_THREADS: 4
        run: |
          log_resources() {
            echo "Resource usage at $(date --utc --iso-8601=seconds)"
            free --mebi
            df --human-readable / "$RUNNER_TEMP"
          }

          log_resources
          (
            while sleep 60 >/dev/null 2>&1; do
              log_resources
            done
          ) &
          monitor_pid=$!
          cleanup() {
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            # Stop any surviving build container before saving its shared state.
            containers=$(docker ps --quiet --filter ancestor=openbmc-x570d4u)
            if [[ -n $containers ]]; then
              docker stop --time 30 $containers
            fi
            log_resources || true
          }
          trap cleanup EXIT
          # Reserve time within the six-hour job limit to save shared state.
          timeout --signal=TERM --kill-after=2m 315m ./build.sh

      - name: Save BitBake shared state
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/openbmc-work/build/sstate-cache
          key: sstate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openbmc-revision', 'Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare release images
        run: |
          shopt -s nullglob
          archives=()
          for archive in output/x570d4u-*.tar; do
            [[ ${archive##*/} =~ ^x570d4u-[0-9]{14}\.tar$ ]] && archives+=("$archive")
          done
          if (( ${#archives[@]} != 1 )) || [[ ! -f ${archives[0]} ]]; then
            echo 'Expected exactly one firmware update archive' >&2
            exit 1
          fi
          timestamp=${archives[0]#output/x570d4u-}
          timestamp=${timestamp%.tar}
          image="output/obmc-phosphor-image-x570d4u-${timestamp}.static.mtd"
          if [[ ! -f $image ]] || [[ $(wc -c < "$image") -ne 67108864 ]]; then
            echo 'Expected a 64 MiB full-flash image matching the update archive' >&2
            exit 1
          fi
          mkdir release
          cp -L "${archives[0]}" release/
          cp -L "$image" "release/x570d4u-${timestamp}.socflash.bin"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" release/* --target "$RELEASE_COMMIT" --generate-notes
