pwm2: temperature nct6796 TSI0_TEMP,CPUTIN 50:20,60:50,70:60,80:70,90:100
pwm3: temperature nct6796 TSI0_TEMP,CPUTIN 50:20,60:50,70:60,80:70,90:100
pwm4: fixed 40
# FAN5 (pwm5) is not installed.
pwm6: fixed 50
